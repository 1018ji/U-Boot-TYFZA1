name: Build TYFZA1 U-Boot

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uboot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            device-tree-compiler flex bison libssl-dev python3-cryptography python3-dev \
            python3-pyelftools python3-setuptools swig libgnutls28-dev uuid-dev qemu-system-arm
      - name: Obtain verified boot baselines
        run: |
          mkdir -p inputs
          cp evidence/stock-boot/*-boot.bin inputs/
          python3 - <<'PYCODE'
          import hashlib, json
          from pathlib import Path
          for profile in json.loads(Path('evidence/stock-inputs.json').read_text()):
              path = Path('inputs') / (profile['variant'] + '-boot.bin')
              assert hashlib.sha256(path.read_bytes()).hexdigest() == profile['boot_sha256'], path
          PYCODE
      - name: Build U-Boot and universal installer
        run: |
          sh scripts/build.sh
          sh scripts/package_release.sh
      - name: Test production code
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          node tests/frontend_test.js
          python3 scripts/test_sandbox_crypto.py
          for variant in 4ge 2p5g; do
            sh output/release/tyfza1-uboot-install.run --check "inputs/$variant-boot.bin"
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tyfza1-uboot-${{ github.sha }}
          path: output/release/
          retention-days: 30
      - name: Publish stable release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --target "$GITHUB_SHA" \
              --title "U-Boot $(cat VERSION)" --notes-file RELEASE_NOTES.md --draft
          fi
          gh release upload "$GITHUB_REF_NAME" \
            output/release/tyfza1-uboot-install.run \
            output/release/tyfza1-uboot-universal.bin --clobber
          gh release edit "$GITHUB_REF_NAME" --title "U-Boot $(cat VERSION)" \
            --notes-file RELEASE_NOTES.md --prerelease=false --draft=false --latest
